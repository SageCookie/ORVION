spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orvion_db}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:orvion_user}
    password: ${DB_PASSWORD:orvion_secure_password_123}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
