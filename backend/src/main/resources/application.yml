spring:
  application:
    name: ORVION Business Operations Platform
  profiles:
    active: h2
  main:
    allow-bean-definition-overriding: true

server:
  port: 8080
  servlet:
    context-path: /

orvion:
  jwt:
    secret: ${JWT_SECRET:404D635166546A576E5A7234753778214125442A472D4B6150645267556B5870}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ml:
    base-url: ${ORVION_ML_BASE_URL:http://localhost:8000}
    timeout-ms: ${ORVION_ML_TIMEOUT_MS:8000}
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
  storage:
    upload-dir: ${STORAGE_LOCATION:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
